---
# =====================================================================
# モード3: 企業別チェック（custom_check.dig / 任意のスパン）
# =====================================================================
#
# ■ custom_groups（実行スパンごとのグループ）
#   custom_check.dig の custom_group で、どのグループを実行するか指定します。
#   別スパンで実行したい場合は custom_check.dig をコピーし、schedule と custom_group を変更してください。
#     title          : 通知タイトルに付ける名前
#     lookback_hours : さかのぼって確認する時間（時間）
custom_groups:
  daily:
    title: "日次"
    lookback_hours: 24
  weekly:
    title: "週次"
    lookback_hours: 168
  monthly:
    title: "月次"
    lookback_hours: 744

# ■ custom_checks（チェック項目）
#     title    : 通知に表示する名前
#     severity : critical / high / medium / low
#     group    : 上の custom_groups のキー
#     query    : 実行するSQLファイル（queries/custom/ 配下）
#     params   : SQL内で ${custom_checks[check_id].params.xxx} として参照できる値
#     enabled  : false で一時停止
#
#   SQLの書き方は queries/custom/README.md を参照してください。
custom_checks:

  watched_table_access:
    title: "重要テーブルへのアクセス"
    severity: medium
    group: weekly
    query: queries/custom/watched_table_access.sql
    params:
      # 監視したいデータベース名（resource_name / target_table に含まれるもの）
      watched_databases: ["customer_master", "member_pii"]
    enabled: true

  top_downloaders:
    title: "ダウンロード量の多いユーザー"
    severity: low
    group: weekly
    query: queries/custom/top_downloaders.sql
    params:
      top_n: 10
      min_bytes: 10485760      # 10MB 以上のみ（bytesize は圧縮後 msgpack.gz のサイズ）
    enabled: true

  inactive_users:
    title: "長期間ログインしていないユーザー（棚卸し候補）"
    severity: low
    group: monthly
    query: queries/custom/inactive_users.sql
    params:
      inactive_days: 90
    enabled: true

  # -------------------------------------------------------------------
  # 管理者向けおすすめパターン（daily グループ / custom_check_daily.dig で実行）
  # 詳細: skill/auditlog-alert-builder/references/recommended-patterns.md
  # -------------------------------------------------------------------

  brute_force_success:
    title: "ログイン失敗の連続後にログイン成功（総当たりの成功）"
    severity: critical
    group: daily
    query: queries/custom/brute_force_success.sql
    params:
      min_failures: 5          # この回数以上失敗した後の成功を検知
      within_minutes: 60       # 最後の失敗からこの分数以内の成功
    enabled: true

  multi_ip_user:
    title: "短時間に多数のネットワークからアクセス（アカウント共有・キー漏洩）"
    severity: high
    group: daily
    query: queries/custom/multi_ip_user.sql
    params:
      min_networks: 4          # 1時間あたりの異なるネットワーク（/16）数
    enabled: true

  apikey_then_new_ip:
    title: "APIキー発行直後に、普段と違うIPから利用"
    severity: high
    group: daily
    query: queries/custom/apikey_then_new_ip.sql
    params:
      within_hours: 24
    enabled: true

  privilege_then_access:
    title: "権限付与の直後にデータへ大量アクセス"
    severity: high
    group: daily
    query: queries/custom/privilege_then_access.sql
    params:
      within_hours: 24
      min_events: 20
    enabled: true

  new_connection_export:
    title: "新しい外部接続の作成とデータ出力"
    severity: medium
    group: daily
    query: queries/custom/new_connection_export.sql
    params: {}
    enabled: true

  external_mail_send:
    title: "ワークフローから社外ドメインへのメール送信"
    severity: high
    group: daily
    query: queries/custom/external_mail_send.sql
    params:
      internal_domains: ["example.com"]           # 自社のメールドメイン（必ず変更）
      allowed_external_domains: []                # 正規に送ってよい社外ドメイン
    enabled: false             # internal_domains を設定してから true に

  watch_list_users:
    title: "要注意ユーザー（退職予定者・委託先など）の操作"
    severity: medium
    group: daily
    query: queries/custom/watch_list_users.sql
    params:
      users: ["leaving-user@example.com"]         # 監視したいユーザー
    enabled: false             # users を設定してから true に
