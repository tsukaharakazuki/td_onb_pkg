---
# =====================================================================
# IP ホワイトリスト（緊急モード: ホワイトリスト外IPアクセス検知で使用）
# =====================================================================
# - CIDR 表記で書きます（単一IPは /32、IPv6 は /128）
# - TD コンソールの IP Whitelist 設定と同じ内容にするのが基本です
# - 社内システム・連携サーバーなど、正規にアクセスする送信元IPも追加してください
# - cidrs が空、または enabled: false の場合、このルールは実行されません
# - 監査ログ上 ip_address = 'internal' の操作（TD内部のワークフロー実行など）は常に対象外です

ip_whitelist:
  enabled: true
  cidrs:
    - "203.0.113.0/24"      # 例: 本社オフィス
    - "198.51.100.10/32"    # 例: VPN 出口
