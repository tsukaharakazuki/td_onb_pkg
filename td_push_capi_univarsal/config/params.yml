  ## ----------------------------------------------------------
  ## OpenAI Ads Conversion API
  ## Conversions API KeyはIntegration Hub認証に保存する。
  ## 現行テンプレートは購買(order_created)。他のイベントはSQLの個別設計が必要。
  ## ----------------------------------------------------------
  # - brand_name: brand_openai
  #   platform: openai
  #   connector: brand_openai_capi
  #   openai_pixel_id: ""
  #   openai_event_type: order_created
  #   openai_action_source: web       # 毎時の送信元
  #   openai_daily_action_source: offline  # 日次。実際の発生元に合わせ、webならpcol_url必須
  #   openai_amount_multiplier: 1   # 元データが主要通貨単位ならJPY=1、USD=100
  #   openai_skip_invalid_records: false

