## ======================================================================
## CAPI 送信ワークフロー パラメータ設定
## ======================================================================
##
## [構造]
##   common: 全PF共通のデータソース・カラム設定
##   brand:  PF別の送信先設定（コネクタ・コンバージョンID等）
##
## [共通ベースデータ]
##   全PFで必要なカラムを網羅した1つのテーブルを作成。
##   各PF送信時に push_*.sql でリネーム・フィルタして出力。
##   ないカラムは NULL として格納。
##
## [メアド設定]
##   js_has_email: true/false → Webログ(JS-SDK)にメアドがあるか
##   purchase_has_email: true/false → 購買ログにメアドがあるか
##   ※ それぞれ false の場合、会員マスタとJOINしてメアドを補完
##
## [ブランド設定]
##   同一PFで別コンバージョンIDに送信する場合は
##   ブランドを分けて個別に設定する。
##   ブランドごとにPF固有の設定のみを記載する。
## ======================================================================

## ----- 共通設定 -----
common:
  database: td_capi_universal
  currency: JPY
  timezone: Asia/Tokyo

  ## --- データソース ---
  js_enabled: true
  log_db: accesslogs
  log_tbl: td_pageviews
  purchase_db: ""
  purchase_tbl: ""

  ## --- メアド設定 ---
  js_has_email: true
  purchase_has_email: false
  email_hashed: false
  phone_hashed: false
  member_db: ""
  member_tbl: ""
  member_id_col: ""
  member_email_col: ""
  member_phone_col: ""

  ## --- JS-SDK カラム名 ---
  col_order_id: ""
  col_email: ""
  col_amount: ""
  col_member_id: ""
  col_phone: ""
  col_country: ""
  col_user_agent: td_user_agent
  col_ip: td_ip
  col_url: td_url
  col_fbc: ""
  col_fbp: ""

  ## --- Yahoo / LINE v2 の任意識別子・Web情報 ---
  ## Cookie値は <timestamp>.<id> の形式を維持。LINE UID使用時は各送信先のchannel_id必須。
  col_ly_su: ""
  col_ly_c: ""
  col_ly_r: ""
  col_line_uid: ""
  col_ifa: ""
  col_referrer_url: ""

  ## --- OpenAI の任意アトリビューション情報 ---
  ## obrefは計測同意がある行だけに設定した列を指定する。自動的にCookieを取得しない。
  col_obref: ""
  col_oppref: ""

  ## --- 購買データ カラム名 ---
  pcol_order_id: ""
  pcol_email: ""
  pcol_amount: ""
  pcol_member_id: ""
  pcol_time: time
  pcol_phone: ""
  pcol_url: ""                 # OpenAIの日次Webイベントを使う場合は必須
  pcol_ly_su: ""
  pcol_ly_c: ""
  pcol_ly_r: ""
  pcol_line_uid: ""
  pcol_ifa: ""
  pcol_referrer_url: ""

  ## --- フィルタ条件 ---
  cnv_conditions: "1=1"
  purchase_conditions: "1=1"

## ----- 送信先（ブランド）設定 -----
## 使用するPFのみコメントアウトを外して設定してください。
brand: []

  ## ----------------------------------------------------------
  ## Facebook CAPI
  ## ----------------------------------------------------------
  # - brand_name: brand_fb
  #   platform: facebook
  #   connector: brand_fb_capi
  #   fb_test_event_code: ""

  ## ----------------------------------------------------------
  ## LINE向け（Yahoo! Ads Conversion API V2認証を使用）
  ## Yahooとはbrand_name・connector・tag_idを独立して設定できる。
  ## アクセストークンはIntegration Hub認証に保存し、ここには書かない。
  ## ----------------------------------------------------------
  # - brand_name: brand_line
  #   platform: line
  #   connector: brand_line_yahoo_v2
  #   tag_id: ""
  #   channel_id: ""                # line_uidを送る場合は必須
  #   event_type: purchase
  #   event_snippet_id: ""          # Yahoo側の計測設定で必要な場合に指定
  #   test_flag: false
  #   custom_label: ""
  #   skip_invalid_records: false   # 不正行を送信済みにしないため停止を推奨
  #   stop_on_batch_failure: true

  ## ----------------------------------------------------------
  ## TikTok Events API
  ## ----------------------------------------------------------
  # - brand_name: brand_tiktok
  #   platform: tiktok
  #   connector: brand_tiktok_events
  #   tiktok_event_data_source: WEB
  #   tiktok_event_source_id: ""
  #   tiktok_advertiser_id: ""
  #   tiktok_test_event_code: ""

  ## ----------------------------------------------------------
  ## Yahoo! Ads Conversion API V2（ディスプレイ広告。検索広告は対象外）
